<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpa | Prisma Creative Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    
    <!-- Scripts: React, Tailwind, Framer Motion, Lucide -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#DEDBC8',
                    },
                    fontFamily: {
                        sans: ['Almarai', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                    },
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Almarai', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif; }
        
        body { background-color: #000000; color: #E1E0CC; margin: 0; overflow-x: hidden; }

        .noise-overlay {
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { motion, useInView, useScroll, useTransform } = window.Motion;
        const { useRef, useEffect, useState } = React;

        // --- COMPONENTS ---

        const WordsPullUp = ({ text, className, showAsterisk = false }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-100px" });
            const words = text.split(" ");

            return (
                <div ref={ref} className={`flex flex-wrap overflow-hidden ${className}`}>
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            initial={{ y: "100%" }}
                            animate={isInView ? { y: 0 } : { y: "100%" }}
                            transition={{ duration: 0.8, delay: i * 0.08, ease: [0.16, 1, 0.3, 1] }}
                            className="relative inline-block mr-[0.2em]"
                        >
                            {word}
                            {showAsterisk && i === words.length - 1 && (
                                <span className="absolute top-[0.65em] -right-[0.3em] text-[0.31em]">*</span>
                            )}
                        </motion.span>
                    ))}
                </div>
            );
        };

        const WordsPullUpMultiStyle = ({ segments, className }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-100px" });
            
            let wordIndex = 0;
            return (
                <div ref={ref} className={`inline-flex flex-wrap justify-center overflow-hidden ${className}`}>
                    {segments.map((segment, sIdx) => (
                        segment.text.split(" ").map((word, wIdx) => {
                            const currentIdx = wordIndex++;
                            return (
                                <motion.span
                                    key={`${sIdx}-${wIdx}`}
                                    initial={{ y: "120%" }}
                                    animate={isInView ? { y: 0 } : { y: "120%" }}
                                    transition={{ duration: 0.8, delay: currentIdx * 0.05, ease: [0.16, 1, 0.3, 1] }}
                                    className={`inline-block mr-[0.25em] ${segment.className}`}
                                >
                                    {word}
                                </motion.span>
                            );
                        })
                    ))}
                </div>
            );
        };

        const AnimatedLetter = ({ char, progress, range }) => {
            const opacity = useTransform(progress, range, [0.2, 1]);
            return <motion.span style={{ opacity }}>{char}</motion.span>;
        };

        const ScrollRevealText = ({ text }) => {
            const ref = useRef(null);
            const { scrollYProgress } = useScroll({
                target: ref,
                offset: ["start 0.8", "end 0.2"]
            });

            const characters = text.split("");
            return (
                <p ref={ref} className="text-[#DEDBC8] text-xs sm:text-sm md:text-base leading-relaxed">
                    {characters.map((char, i) => {
                        const step = 1 / characters.length;
                        const start = i * step;
                        const end = start + 0.1;
                        return <AnimatedLetter key={i} char={char} progress={scrollYProgress} range={[start, end]} />;
                    })}
                </p>
            );
        };

        // --- SECTIONS ---

        const Hero = () => {
            return (
                <section className="h-screen w-full p-4 md:p-6 relative">
                    <div className="w-full h-full rounded-2xl md:rounded-[2rem] overflow-hidden relative bg-zinc-900">
                        {/* Video Background */}
                        <video 
                            className="absolute inset-0 w-full h-full object-cover"
                            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_170732_8a9ccda6-5cff-4628-b164-059c500a2b41.mp4"
                            autoPlay loop muted playsInline
                        />
                        
                        <div className="noise-overlay opacity-[0.7] mix-blend-overlay pointer-events-none"></div>
                        <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/60 pointer-events-none"></div>

                        {/* Navbar */}
                        <nav className="absolute top-0 left-1/2 -translate-x-1/2 z-50">
                            <div className="bg-black rounded-b-2xl md:rounded-b-3xl px-4 py-3 md:px-10 flex items-center gap-3 sm:gap-6 md:gap-12 lg:gap-14 border-x border-b border-white/5">
                                {["Our story", "Collective", "Workshops", "Programs", "Inquiries"].map((item) => (
                                    <a key={item} href="#" className="text-[10px] sm:text-xs md:text-sm whitespace-nowrap transition-colors" 
                                       style={{ color: 'rgba(225, 224, 204, 0.8)' }}
                                       onMouseOver={e => e.target.style.color = '#E1E0CC'}
                                       onMouseOut={e => e.target.style.color = 'rgba(225, 224, 204, 0.8)'}>
                                        {item}
                                    </a>
                                ))}
                            </div>
                        </nav>

                        {/* Hero Content */}
                        <div className="absolute bottom-0 left-0 right-0 p-6 md:p-12">
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-end">
                                <div className="md:col-span-8">
                                    <WordsPullUp 
                                        text="Prisma" 
                                        showAsterisk={true}
                                        className="text-[26vw] sm:text-[24vw] md:text-[22vw] lg:text-[20vw] xl:text-[19vw] 2xl:text-[20vw] font-medium leading-[0.85] tracking-[-0.07em] text-[#E1E0CC]"
                                    />
                                </div>
                                <div className="md:col-span-4 pb-4 md:pb-8 flex flex-col gap-6">
                                    <motion.p 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.5, duration: 1, ease: [0.16, 1, 0.3, 1] }}
                                        className="text-primary/70 text-xs sm:text-sm md:text-base leading-[1.2] max-w-xs"
                                    >
                                        Prisma is a worldwide network of visual artists, filmmakers and storytellers bound not by place, status or labels but by passion and hunger to unlock potential.
                                    </motion.p>
                                    
                                    <motion.button 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.7, duration: 1, ease: [0.16, 1, 0.3, 1] }}
                                        className="group flex items-center justify-between bg-primary w-fit pr-1 pl-5 py-1 rounded-full gap-2 transition-all hover:gap-4"
                                    >
                                        <span className="text-black font-medium text-sm sm:text-base">Join the lab</span>
                                        <div className="bg-black rounded-full w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center transition-transform group-hover:scale-110">
                                            <i data-lucide="arrow-right" className="text-white w-4 h-4"></i>
                                        </div>
                                    </motion.button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section className="bg-black py-24 px-4 md:px-20">
                    <div className="bg-[#101010] rounded-[2.5rem] p-8 md:p-24 text-center max-w-7xl mx-auto border border-white/5">
                        <span className="text-primary text-[10px] sm:text-xs tracking-widest uppercase mb-8 block">Visual arts</span>
                        
                        <WordsPullUpMultiStyle 
                            className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl max-w-4xl mx-auto leading-[0.95] sm:leading-[0.9] text-[#E1E0CC] mb-12"
                            segments={[
                                { text: "I am Marcus Chen,", className: "font-normal" },
                                { text: "a self-taught director.", className: "font-serif italic" },
                                { text: "I have skills in color grading, visual effects, and narrative design.", className: "font-normal" }
                            ]}
                        />

                        <div className="max-w-2xl mx-auto">
                            <ScrollRevealText text="Over the last seven years, I have worked with Parallax, a Berlin-based production house that crafts cinema, series, and Noir Studio in Paris. Together, we have created work that has earned international acclaim at several major festivals." />
                        </div>
                    </div>
                </section>
            );
        };

        const FeatureCard = ({ index, title, num, icon, items, video }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-100px" });

            return (
                <motion.div 
                    ref={ref}
                    initial={{ opacity: 0, scale: 0.95 }}
                    animate={isInView ? { opacity: 1, scale: 1 } : {}}
                    transition={{ duration: 0.8, delay: index * 0.15, ease: [0.22, 1, 0.36, 1] }}
                    className={`relative rounded-3xl overflow-hidden h-[480px] flex flex-col ${video ? '' : 'bg-[#212121] p-8 border border-white/5'}`}
                >
                    {video ? (
                        <>
                            <video className="absolute inset-0 w-full h-full object-cover" src={video} autoPlay loop muted playsInline />
                            <div className="absolute inset-0 bg-black/20"></div>
                            <div className="mt-auto relative z-10 p-8">
                                <h3 className="text-2xl font-medium text-[#E1E0CC]">{title}</h3>
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="flex justify-between items-start mb-12">
                                <img src={icon} className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl object-cover" alt="" />
                                <span className="text-primary/30 font-mono text-sm">{num}</span>
                            </div>
                            <div>
                                <h3 className="text-xl font-medium text-[#E1E0CC] mb-6">{title}</h3>
                                <ul className="space-y-4 mb-auto">
                                    {items.map((item, i) => (
                                        <li key={i} className="flex gap-3 items-start">
                                            <i data-lucide="check" className="text-primary w-4 h-4 mt-1 flex-shrink-0"></i>
                                            <span className="text-gray-400 text-sm">{item}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <button className="mt-auto flex items-center gap-2 text-primary text-sm group">
                                Learn more 
                                <i data-lucide="arrow-right" className="w-4 h-4 -rotate-45 transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                            </button>
                        </>
                    )}
                </motion.div>
            );
        };

        const Features = () => {
            return (
                <section className="min-h-screen bg-black relative py-24 px-4 md:px-8">
                    <div className="bg-noise opacity-[0.15] absolute inset-0 pointer-events-none"></div>
                    
                    <div className="relative z-10 max-w-7xl mx-auto mb-20">
                        <WordsPullUpMultiStyle 
                            className="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-normal leading-tight"
                            segments={[
                                { text: "Studio-grade workflows for visionary creators.", className: "text-primary block w-full" },
                                { text: "Built for pure vision. Powered by art.", className: "text-gray-500 block w-full mt-2" }
                            ]}
                        />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 max-w-7xl mx-auto">
                        <FeatureCard 
                            index={0}
                            video="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260406_133058_0504132a-0cf3-4450-a370-8ea3b05c95d4.mp4"
                            title="Your creative canvas."
                        />
                        <FeatureCard 
                            index={1}
                            num="01"
                            icon="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171918_4a5edc79-d78f-4637-ac8b-53c43c220606.png&w=1280&q=85"
                            title="Project Storyboard."
                            items={["Frame-by-frame planning", "Dynamic moodboards", "Shot list generation", "Sequence mapping"]}
                        />
                        <FeatureCard 
                            index={2}
                            num="02"
                            icon="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171741_ed9845ab-f5b2-4018-8ce7-07cc01823522.png&w=1280&q=85"
                            title="Smart Critiques."
                            items={["AI-driven visual analysis", "Contextual creative notes", "Adobe Suite integration"]}
                        />
                        <FeatureCard 
                            index={3}
                            num="03"
                            icon="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171809_f56666dc-c099-4778-ad82-9ad4f209567b.png&w=1280&q=85"
                            title="Immersion Capsule."
                            items={["Notification silencing", "Ambient soundscapes", "Focus schedule syncing"]}
                        />
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer className="bg-[#101010] pt-24 pb-12 px-6 md:px-20 border-t border-white/5">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-12 mb-20">
                            <div className="col-span-2">
                                <h2 className="text-primary text-3xl font-medium mb-6">Harpa*</h2>
                                <p className="text-gray-500 text-sm max-w-xs">
                                    Crafting the future of visual narrative through technology and human intuition.
                                </p>
                            </div>
                            <div>
                                <h4 className="text-primary text-xs uppercase tracking-widest mb-6 font-bold">Studio</h4>
                                <ul className="space-y-3 text-sm text-gray-400">
                                    <li><a href="#" className="hover:text-primary transition-colors">Manifesto</a></li>
                                    <li><a href="#" className="hover:text-primary transition-colors">Projects</a></li>
                                    <li><a href="#" className="hover:text-primary transition-colors">Lab</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-primary text-xs uppercase tracking-widest mb-6 font-bold">Social</h4>
                                <ul className="space-y-3 text-sm text-gray-400">
                                    <li><a href="#" className="hover:text-primary transition-colors">Instagram</a></li>
                                    <li><a href="#" className="hover:text-primary transition-colors">Vimeo</a></li>
                                    <li><a href="#" className="hover:text-primary transition-colors">Twitter</a></li>
                                </ul>
                            </div>
                            <div className="col-span-2">
                                <h4 className="text-primary text-xs uppercase tracking-widest mb-6 font-bold">Newsletter</h4>
                                <div className="flex border-b border-primary/20 py-2">
                                    <input type="email" placeholder="email@address.com" className="bg-transparent border-none outline-none text-sm w-full text-primary placeholder:text-gray-600" />
                                    <button className="text-primary text-sm hover:translate-x-1 transition-transform">Submit</button>
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/5 gap-4">
                            <p className="text-gray-600 text-[10px]">© 2026 HARPA DESIGN STUDIO. ALL RIGHTS RESERVED.</p>
                            <p className="text-gray-600 text-[10px]">DESIGNED IN PARIS — BUILT GLOBALLY</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <main className="bg-black">
                    <Hero />
                    <About />
                    <Features />
                    <Footer />
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
