<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER | Liquid Motion</title>
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --accent-1: #ffcf00; /* Yellow */
            --accent-2: #ff3e3e; /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* UI Layer */
        .interface {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }

        .logo {
            position: absolute;
            top: 40px;
            font-weight: 900;
            letter-spacing: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        h1 {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            line-height: 0.8;
            mix-blend-mode: difference; /* Makes text react to the water color */
        }

        .tagline {
            margin-top: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-1);
        }

        /* Canvas Setup */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Visual Noise for Premium Feel */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 5;
            opacity: 0.05;
            pointer-events: none;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
        }
    </style>
</head>
<body>

    <div class="grain"></div>

    <div class="interface">
        <div class="logo">AETHER ARTIFACTS</div>
        <h1>FLOW</h1>
        <div class="tagline">Interactive Fluid Dynamics</div>
    </div>

    <div id="canvas-container">
        <canvas id="waterCanvas"></canvas>
    </div>

    <script>
        /**
         * LIQUID WATER DISPLACEMENT ENGINE
         */
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        let ripples = [];
        const maxRipples = 100;
        
        // Mouse State
        const mouse = { x: 0, y: 0, vX: 0, vY: 0, oldX: 0, oldY: 0 };

        class Ripple {
            constructor(x, y, v) {
                this.x = x;
                this.y = y;
                this.v = v; // Velocity/Strength
                this.r = 2; // Radius
                this.alpha = 1;
                this.life = 1.0;
            }

            update() {
                this.r += 4; // Expansion speed
                this.life *= 0.96; // Fade speed
                this.alpha = this.life;
            }

            draw() {
                // We draw the "pressure" into the canvas
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
                
                // Colors: Yellow core, Red outer ripple
                const r = 255;
                const g = Math.floor(62 + (this.life * 150)); // Fade from yellow to red
                const b = 62;

                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.4})`);
                gradient.addColorStop(1, `rgba(${r}, 62, 62, 0)`);

                ctx.beginPath();
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                
                // Calculate velocity for "splash" intensity
                mouse.vX = Math.abs(mouse.x - mouse.oldX);
                mouse.vY = Math.abs(mouse.y - mouse.oldY);
                const speed = Math.sqrt(mouse.vX**2 + mouse.vY**2);

                if (speed > 2) {
                    ripples.push(new Ripple(mouse.x, mouse.y, speed));
                }

                if (ripples.length > maxRipples) ripples.shift();
                
                mouse.oldX = mouse.x;
                mouse.oldY = mouse.y;
            });

            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function animate() {
            // 1. Create the "trailing" water effect by not fully clearing the frame
            // This creates the liquid "smear"
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; 
            ctx.fillRect(0, 0, width, height);

            // 2. Add subtle wave distortion logic (Blur simulation)
            ctx.globalCompositeOperation = 'screen'; 

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.update();
                r.draw();
                
                if (r.life < 0.01) {
                    ripples.splice(i, 1);
                }
            }

            // 3. Ambient floating "mist"
            ctx.globalCompositeOperation = 'source-over';
            drawAmbient();

            requestAnimationFrame(animate);
        }

        function drawAmbient() {
            // Very subtle ambient light
            const time = Date.now() * 0.001;
            const grad = ctx.createRadialGradient(
                width/2 + Math.sin(time)*100, height/2 + Math.cos(time)*100, 0,
                width/2, height/2, width
            );
            grad.addColorStop(0, 'rgba(255, 62, 62, 0.03)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        init();
    </script>
</body>
</html>
