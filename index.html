<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass | Premium Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;800&display=swap');

        :root {
            --bg: #030303;
            --accent-yellow: #ffcc00;
            --accent-red: #ff3300;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* The Liquid Canvas */
        #canvas-wrapper {
            position: fixed;
            inset: 0;
            z-index: 1;
            /* Creates the "watery" blending of colors */
            filter: blur(40px) contrast(150%);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* --- GLASSMORPHISM UI --- */
        .glass-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        main {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            /* Interaction: moves slightly with mouse (via JS) */
            transition: transform 0.1s ease-out;
        }

        .category {
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--accent-yellow);
            margin-bottom: 20px;
            font-weight: 800;
        }

        h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 b { font-weight: 800; }

        p {
            color: rgba(255,255,255,0.5);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.05);
        }

        .btn:hover {
            background: white;
            color: black;
        }

        /* Subtle Grain */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.05;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-wrapper">
        <canvas id="liquidCanvas"></canvas>
    </div>

    <div class="glass-overlay"></div>

    <main>
        <div class="glass-card" id="card">
            <div class="category">Interactive Design</div>
            <h1>LIQUID <b>GOLD</b></h1>
            <p>A cinematic interactive experience built with vanilla JavaScript. Move your cursor to disturb the molten flow beneath the surface.</p>
            <a href="#" class="btn">EXPLORE WORK</a>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        const card = document.getElementById('card');

        let width, height;
        let points = [];
        const mouse = { x: 0, y: 0, active: false, vX: 0, vY: 0 };
        const pointCount = 35; // Trail length

        function init() {
            resize();
            for (let i = 0; i < pointCount; i++) {
                points.push({ x: width/2, y: height/2, vX: 0, vY: 0 });
            }
            
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouse.vX = e.clientX - mouse.x;
                mouse.vY = e.clientY - mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;

                // Subtle card tilt for premium feel
                const xTilt = (window.innerWidth / 2 - e.clientX) / 50;
                const yTilt = (window.innerHeight / 2 - e.clientY) / 50;
                card.style.transform = `rotateY(${xTilt}deg) rotateX(${yTilt}deg)`;
            });

            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function animate() {
            // We don't clear fully to create the "viscous smear"
            ctx.fillStyle = 'rgba(3, 3, 3, 0.08)';
            ctx.fillRect(0, 0, width, height);

            let leaderX = mouse.x;
            let leaderY = mouse.y;

            points.forEach((p, i) => {
                // Physics: Each point follows the one before it with easing
                const easing = 0.25 - (i * 0.005);
                p.x += (leaderX - p.x) * easing;
                p.y += (leaderY - p.y) * easing;

                // Draw the "liquid" segment
                const size = 100 - (i * 2.5);
                if (size > 0) {
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
                    
                    // The "Yellow/Red" Molten mix
                    const opacity = (1 - i / pointCount) * 0.8;
                    gradient.addColorStop(0, `rgba(255, 204, 0, ${opacity})`); // Gold
                    gradient.addColorStop(0.5, `rgba(255, 51, 0, ${opacity * 0.5})`); // Fire Red
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.beginPath();
                    ctx.fillStyle = gradient;
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                leaderX = p.x;
                leaderY = p.y;
            });

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
